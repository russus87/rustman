<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rustman</title>
    <script>
      // Tema, accento e scala letti prima che parta l'app, con le stesse regole
      // di applicaTema() in src/lib/settings.svelte.js: la schermata di avvio
      // ha già i colori giusti e non lampeggia scura su un tema chiaro.
      try {
        const s = JSON.parse(localStorage.getItem("rustman_settings") || "{}");
        let chiaro = s.tema === "chiaro";
        if (s.tema === "sistema") chiaro = matchMedia("(prefers-color-scheme: light)").matches;
        const r = document.documentElement;
        r.dataset.tema = chiaro ? "light" : "dark";
        if (s.accento) r.style.setProperty("--accent", s.accento);
        if (s.scala) r.style.zoom = String(s.scala);
      } catch { /* impostazioni illeggibili: restano i colori di default */ }
    </script>
    <style>
      /* Schermata di avvio, alla Postman: marchio al centro e una barra che si
         riempie. Sta qui e non in app.css perché app.css arriva col bundle JS, e
         questa deve comparire prima. Le classi .avvio* sono globali di
         proposito: le riusa src/components/Avvio.svelte, che prende il posto di
         questa appena l'app è montata con lo stesso identico markup, così il
         passaggio fra le due non si vede. I colori ricalcano quelli di app.css. */
      :root {
        --av-bg: #0c0c11; --av-txt: #e7e7ee; --av-dim: #9a9aab; --av-faint: #5f5f72;
        --av-traccia: rgba(255, 255, 255, .07);
      }
      :root[data-tema="light"] {
        --av-bg: #f5f6f9; --av-txt: #1b1e26; --av-dim: #5b6273; --av-faint: #9aa0b0;
        --av-traccia: rgba(0, 0, 0, .07);
      }
      html, body { margin: 0; background: var(--av-bg); }
      .avvio {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        background: var(--av-bg); color: var(--av-txt);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none; cursor: default;
      }
      /* Il blocco centrale ha sempre la stessa altezza: gli errori, quando ci
         sono, gli stanno sotto in posizione assoluta e non spostano il logo. */
      .avvio-centro { position: relative; display: flex; flex-direction: column; align-items: center; }
      .avvio-logo {
        width: 72px; height: 72px; border-radius: 19px;
        display: grid; place-items: center;
        /* Un velo chiaro→scuro sopra l'accento pieno: rende la stessa sfumatura
           del logo nella barra del titolo senza color-mix(), che le webview
           più vecchie non conoscono. */
        background: linear-gradient(145deg, rgba(255, 255, 255, .16), rgba(0, 0, 0, .14)), var(--accent, #7c5cff);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset, 0 12px 34px rgba(0, 0, 0, .28);
        color: #fff; font-weight: 800; font-size: 34px;
      }
      .avvio-nome { margin-top: 18px; font-size: 21px; font-weight: 700; letter-spacing: .3px; }
      .avvio-barra {
        margin-top: 30px; width: 240px; height: 4px; border-radius: 2px;
        background: var(--av-traccia); overflow: hidden;
      }
      .avvio-riempi {
        height: 100%; width: 0; border-radius: 2px;
        background: var(--accent, #7c5cff);
      }
      /* Prima che arrivi il bundle non si sa quanto manca: un tratto che scorre. */
      .avvio-riempi.indefinita { width: 34%; animation: avvio-scorri 1.1s ease-in-out infinite; }
      @keyframes avvio-scorri { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      .avvio-stato { margin-top: 12px; min-height: 17px; color: var(--av-dim); font-size: 12.5px; }
      .avvio-ver {
        position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
        color: var(--av-faint); font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace; font-size: 11px;
      }
      @media (prefers-reduced-motion: reduce) {
        .avvio-riempi.indefinita { animation: none; width: 100%; opacity: .35; }
      }
    </style>
  </head>
  <body>
    <!-- Visibile finché il bundle non è caricato; poi Avvio.svelte la sostituisce. -->
    <div id="avvio" class="avvio">
      <div class="avvio-centro">
        <div class="avvio-logo">R</div>
        <div class="avvio-nome">Rustman</div>
        <div class="avvio-barra"><div class="avvio-riempi indefinita"></div></div>
        <div class="avvio-stato">Avvio…</div>
      </div>
      <div class="avvio-ver">v__VERSIONE__</div>
    </div>
    <!-- Punto di montaggio dell'app Svelte -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
